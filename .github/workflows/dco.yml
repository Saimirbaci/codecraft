# DCO: every commit in a pull request must carry a "Signed-off-by:" line (git commit -s).
# See CONTRIBUTING.md.

name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add it with: git commit --amend -s   (or git rebase --signoff)"
            exit 1
          fi
