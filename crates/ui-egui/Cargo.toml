[package]
name = "codecraft-ui-egui"
description = "CodeCraft egui shell: menus, editor, tool windows and popups; a thin layer over the engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
codecraft-selfupdate.workspace = true
codecraft-text.workspace = true
codecraft-syntax.workspace = true
codecraft-fs.workspace = true
codecraft-lsp.workspace = true
codecraft-cargo.workspace = true
codecraft-workspace.workspace = true
codecraft-spec.workspace = true
codecraft-engine.workspace = true
egui.workspace = true
eframe.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# feedback overlay: composite annotations onto the screenshot and encode PNGs
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
# Settings › Editor › Font: check a font file with the parser egui's renderer uses (already in the
# tree through epaint) before handing it over, since the renderer aborts on unparsable fonts
skrifa = { version = "0.44", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
# the global menu bar; arboard (already in the tree through egui-winit) reads the clipboard when a
# native Paste is forwarded to a text field
muda.workspace = true
arboard = { version = "3", default-features = false }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
