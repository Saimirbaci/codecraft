[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/codecraft", "apps/codecraft-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
codecraft-text = { path = "crates/text" }
codecraft-syntax = { path = "crates/syntax" }
codecraft-fs = { path = "crates/fs" }
codecraft-lsp = { path = "crates/lsp" }
codecraft-cargo = { path = "crates/cargo" }
codecraft-dap = { path = "crates/dap" }
codecraft-db = { path = "crates/db" }
codecraft-agent = { path = "crates/agent" }
codecraft-mcp = { path = "crates/mcp" }
codecraft-workspace = { path = "crates/workspace" }
codecraft-engine = { path = "crates/engine" }
codecraft-ui-egui = { path = "crates/ui-egui" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ropey = { version = "1.6", default-features = false, features = ["simd"] }  # no unicode_lines: line numbers must match rust-analyzer
regex = "1"
ignore = "0.4"
crossbeam-channel = "0.5"
lsp-types = "0.97"
ra_ap_rustc_lexer = { package = "ra-ap-rustc_lexer", version = "0.177" }
eframe = "0.36"
egui = "0.36"
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
